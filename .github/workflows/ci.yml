name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Privacy check
        run: python tools/privacy_check.py
      - name: Build everything on the sample data
        run: python tools/build_all.py
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Apps Script tests
        run: node tests/apps_script.test.js
